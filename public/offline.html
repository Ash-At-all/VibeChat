<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#141412">
    <title>Offline · VibeChat</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #141412; color: #e8e7e1; }
      body { min-height: 100dvh; display: grid; place-items: center; margin: 0; padding: 24px; box-sizing: border-box; text-align: center; }
      main { max-width: 28rem; }
      h1 { font-size: 1.5rem; }
      p { color: #b8b8ae; line-height: 1.5; }
      button { min-height: 44px; padding: 8px 16px; border: 0; border-radius: 10px; background: #d9a441; color: #211907; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Reconnect to the internet and try again. Your community will be here when you’re back.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
